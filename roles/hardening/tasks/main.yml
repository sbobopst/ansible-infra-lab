---
# ============================================================
# SSH HARDENING
# ============================================================

- name: Configure SSH daemon
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

# ============================================================
# FIREWALL (UFW)
# ============================================================

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set UFW default incoming policy to deny
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set UFW default outgoing policy to allow
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow SSH through firewall
  community.general.ufw:
    rule: allow
    port: "{{ hardening_ssh_port }}"
    proto: tcp

- name: Allow additional ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ hardening_allowed_ports }}"
  when: hardening_allowed_ports | length > 0

- name: Enable UFW
  community.general.ufw:
    state: enabled

# ============================================================
# FAIL2BAN
# ============================================================

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Deploy fail2ban jail configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and started
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# ============================================================
# AUTOMATIC SECURITY UPDATES
# ============================================================

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Deploy unattended-upgrades configuration
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Enable automatic updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

# ============================================================
# SYSTEM HARDENING
# ============================================================

- name: Disable unused filesystems
  ansible.builtin.template:
    src: hardening-modprobe.conf.j2
    dest: /etc/modprobe.d/hardening.conf
    owner: root
    group: root
    mode: "0644"

- name: Apply sysctl hardening settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ hardening_sysctl_settings }}"
